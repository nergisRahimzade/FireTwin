[project]
name = "firetwin"
version = "0.1.0"
description = "FireTwin: AI fire-safety digital twin of an ISS module (NASA Space Apps 2026)."
# The stack is fixed to Python 3.11, so uv refuses any other version.
requires-python = ">=3.11,<3.12"
# Runtime packages (fastapi, pandas, ...) get added by the tasks that need them (BE-05, ML-01, ...).
dependencies = [
    "fastapi>=0.163.0",
    "joblib>=1.6.0",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
# One test folder per layer, plus tests/ at the root for repo-wide checks.
testpaths = ["data/tests", "ml/tests", "backend/tests", "tests"]
# importlib mode: two layers can each have e.g. a test_schema.py without the names clashing.
addopts = "--import-mode=importlib"
# Root exposes data/ml modules; backend exposes app just as uvicorn's --app-dir does.
pythonpath = [".", "backend"]

[tool.ruff]
line-length = 100
# Match the fixed Python version so ruff only suggests syntax that 3.11 supports.
target-version = "py311"
# Tells ruff's import sorter what is our own code: data/ and ml/ (repo root) and app (backend/).
src = [".", "backend"]

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes bugs, I = import sorting.
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
